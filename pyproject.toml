[project]
name = "medical-ai-platform"
version = "0.1.0"
description = "Web-based Medical Image Diagnosis Platform using Deep Learning (X-ray & MRI/Alzheimer)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name", email = "you@example.com" }
]

dependencies = [
    # ── Web framework ──────────────────────────────────────────────────
    "django>=4.2,<5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.1",
    # ── Database ───────────────────────────────────────────────────────
    "psycopg2-binary>=2.9",          # PostgreSQL adapter
    # ── Async task queue ───────────────────────────────────────────────
    "celery>=5.4",
    "redis>=5.0",
    "django-celery-results>=2.5",
    "django-celery-beat>=2.6",
    # ── Storage ────────────────────────────────────────────────────────
    "pillow>=10.3",                  # image I/O & processing
    "boto3>=1.34",                   # S3-compatible storage (optional, for prod)
    "django-storages>=1.14",
    # ── Deep learning core ─────────────────────────────────────────────
    # NOTE: install PyTorch separately via index-url (see README)
    # CPU-only for dev: torch torchvision
    # GPU (CUDA 12.1): torch torchvision --index-url https://download.pytorch.org/whl/cu121
    "torchvision>=0.18",
    # ── Explainable AI ─────────────────────────────────────────────────
    "grad-cam>=1.5",                 # pytorch-grad-cam
    # ── Medical imaging ────────────────────────────────────────────────
    "nibabel>=5.2",                  # NIfTI (.nii/.nii.gz) for MRI
    "nilearn>=0.10",                 # brain image processing / normalization
    "SimpleITK>=2.3",                # image registration & skull stripping helper
    # ── Scientific computing ───────────────────────────────────────────
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "opencv-python-headless>=4.9",   # image ops (headless = no GUI dep)
    "matplotlib>=3.8",
    # ── Utilities ──────────────────────────────────────────────────────
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tqdm>=4.66",
    "loguru>=0.7",
    "djangorestframework-stubs>=3.16.9",
    "celery-types>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "factory-boy>=3.3",              # test fixtures
    "faker>=25.0",
    "ruff>=0.4",                     # linter + formatter
    "mypy>=1.10",
    "django-stubs>=5.0",
    "ipython>=8.24",
    "django-debug-toolbar>=4.3",
    "Werkzeug>=3.0",                 # for runserver_plus
    "django-extensions>=3.2",
]

experiment = [
    "mlflow>=2.13",                  # experiment tracking
    "wandb>=0.17",                   # Weights & Biases (alternative)
    "tensorboard>=2.17",
    "seaborn>=0.13",
    "plotly>=5.22",
]

report = [
    "reportlab>=4.2",                # PDF report generation
    "weasyprint>=62.0",              # HTML → PDF alternative
    "jinja2>=3.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.24",
]

[tool.uv.sources]
# PyTorch CPU index for development (override per-machine for GPU builds)
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
strict = false

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=apps --cov-report=term-missing -v"
asyncio_mode = "auto"
