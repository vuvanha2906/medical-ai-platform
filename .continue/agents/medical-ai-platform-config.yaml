name: Medical AI Platform Config
version: 1.0.0
schema: v1

# Cấu hình chung
enableAgentMode: true       # Bật Agent Mode
#maxInputTokens: 128000      # 128K context (nếu model hỗ trợ)
#maxOutputTokens: 128000
allowCodebaseIndexing: true
allowAutoEdits: true
autoSaveAfterEdit: true
defaultTemperature: 0.5
defaultTopP: 0.9
showTokenUsage: true
useLegacyCompletionsEndpoint: false
allowAnonymousTelemetry: false

models:
  - name: Gemini 2.5 Flash Lite
    provider: gemini
    model: gemini-2.5-flash-lite
    apiKey: ${{ secrets.GEMINI_API_KEY }}
        # Các role cần thiết
    roles:
      - chat       # hội thoại
      - edit       # chỉnh sửa file trong IDE
      - apply      # áp dụng thay đổi
      - autocomplete  # gợi ý/auto-complete (thường Hub preset)
    #      - explain   # giải thích code, logic (tuỳ chọn nhưng hay dùng)

    # Capabilities cho phép model sử dụng tools và truy cập môi trường
    capabilities:
      - tool_use         # gọi MCP server hoặc external tool
      - file_access      # đọc/ghi file
      - project_access   # truy cập workspace/project
      - edit_code        # chỉnh sửa trực tiếp code
      - autocomplete     # autocomplete/IDE integration
    env:
      useLegacyCompletionsEndpoint: false

    # Tuỳ chọn bổ sung để IDE biết hỗ trợ edit tools
    edit:
      enabled: true       # bật tính năng edit (Ctrl+I)
      allowExternalTools: true  # cho phép gọi tools MCP
      maxConcurrentTools: 5      # số tool có thể gọi đồng thời

    # Tool policies (bảo đảm có quyền chạy tự động như Hub)
    toolPolicies:
      default: automatic    # Ask First / Automatic / Excluded
    # Giới hạn max tokens output
#    maxCompletionTokens: 1024  # hoặc nhỏ hơn, tuỳ model
#    maxCompletionTokens: 2048   # 1024 hơi bí, 2048 hợp lý hơn
    maxCompletionTokens: 8192   # 1024 hơi bí, 2048 hợp lý hơn

    # Giới hạn context input (history + prompt)
    maxContextTokens: 32700     # 32k là điểm cân bằng tốt
    maxTokens: 32760

    contextTrimStrategy: oldest-first  # cắt message cũ nhất trước
    defaultCompletionOptions:
      temperature: 0.5
      top_p: 0.9
      top_k: 40
      contextLength: 262144
      maxTokens: 65536


    autocompleteOptions:
      debounceDelay: 350
      maxPromptTokens: 1536     # 1024 hơi ít cho file dài
      onlyMyCode: true
    context:
      - provider: code
      - provider: docs
      - provider: diff
      - provider: terminal
      - provider: problems
      - provider: folder
      - provider: codebase

