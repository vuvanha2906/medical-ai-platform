    roles:
      - chat       # hội thoại
      - edit       # chỉnh sửa file trong IDE
      - apply      # áp dụng thay đổi
     # - autocomplete  # gợi ý/auto-complete (thường Hub preset)
    #      - explain   # giải thích code, logic (tuỳ chọn nhưng hay dùng)

    # Capabilities cho phép model sử dụng tools và truy cập môi trường
    capabilities:
#      - tool_use         # gọi MCP server hoặc external tool
      - file_access      # đọc/ghi file
      - project_access   # truy cập workspace/project
      - edit_code        # chỉnh sửa trực tiếp code
      - autocomplete     # autocomplete/IDE integration
    env:
      useLegacyCompletionsEndpoint: false

    # Tuỳ chọn bổ sung để IDE biết hỗ trợ edit tools
    edit:
      enabled: true       # bật tính năng edit (Ctrl+I)
      allowExternalTools: false  # cho phép gọi tools MCP
      maxConcurrentTools: 5      # số tool có thể gọi đồng thời

    # Tool policies (bảo đảm có quyền chạy tự động như Hub)
    toolPolicies:
      default: automatic    # Ask First / Automatic / Excluded

    contextTrimStrategy: oldest-first  # cắt message cũ nhất trước
    defaultCompletionOptions:
      contextLength: 131100
      maxTokens: 32000

    context:
      - provider: code
      - provider: docs
      - provider: diff
      - provider: terminal
      - provider: problems
      - provider: folder
      - provider: codebase
      - provider: file