<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Research Platform - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            font-family: 'Inter', sans-serif;
        }

        /* Animated background orbs */
        .orb-1 {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            left: -150px;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .orb-2 {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            bottom: -50px;
            right: -100px;
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(30px, -30px); }
            66% { transform: translate(-20px, 30px); }
        }

        /* Subtle grid pattern */
        .grid-pattern {
            background-image:
                linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .form-input {
            background-color: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(16, 185, 129, 0.2);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            background-color: rgba(30, 41, 59, 0.8);
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            outline: none;
        }

        .submit-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .logo-glow { filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.4)); }
        .card-glow { box-shadow: 0 0 60px rgba(16, 185, 129, 0.1), inset 0 0 60px rgba(16, 185, 129, 0.05); }
        .form-input::placeholder { color: rgba(148, 163, 184, 0.6); }

        label {
            color: rgba(226, 232, 240, 0.9);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        a { color: rgba(16, 185, 129, 0.8); transition: color 0.3s ease; }
        a:hover { color: rgba(16, 185, 129, 1); }

        .glassmorphic {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.15);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 min-h-screen overflow-hidden">
    <!-- Animated background elements -->
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="grid-pattern"></div>

    <!-- Main container -->
    <div class="relative z-10 flex items-center justify-center min-h-screen px-4">
        <div class="w-full max-w-md">
            <!-- Header with logo -->
            <div class="text-center mb-8">
                <div class="flex justify-center mb-6">
                    <div class="logo-glow">
                        <svg class="w-16 h-16" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Hospital cross -->
                            <circle cx="32" cy="32" r="30" stroke="#10b981" stroke-width="2" opacity="0.3"/>
                            <circle cx="32" cy="32" r="28" stroke="#10b981" stroke-width="1.5" opacity="0.2"/>
                            <!-- Medical cross -->
                            <rect x="28" y="16" width="8" height="32" fill="#10b981" opacity="0.9"/>
                            <rect x="16" y="28" width="32" height="8" fill="#10b981" opacity="0.9"/>
                            <!-- AI nodes -->
                            <circle cx="20" cy="20" r="3" fill="#06b6d4" opacity="0.7"/>
                            <circle cx="44" cy="20" r="3" fill="#06b6d4" opacity="0.7"/>
                            <circle cx="20" cy="44" r="3" fill="#06b6d4" opacity="0.7"/>
                            <circle cx="44" cy="44" r="3" fill="#06b6d4" opacity="0.7"/>
                            <!-- Connection lines -->
                            <line x1="23" y1="20" x2="41" y2="20" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
                            <line x1="20" y1="23" x2="20" y2="41" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
                            <line x1="44" y1="23" x2="44" y2="41" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
                            <line x1="23" y1="44" x2="41" y2="44" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
                        </svg>
                    </div>
                </div>
                <h1 class="text-3xl font-bold text-slate-100 mb-2">MediAI Research</h1>
                <p class="text-sm text-slate-400">Advanced Diagnostic Intelligence Platform</p>
            </div>

            <!-- Glassmorphic login card -->
            <div class="glassmorphic card-glow rounded-2xl p-8 mb-6">
                <!-- FORM ĐÃ ĐƯỢC CHÈN LOGIC DJANGO -->
                <form method="post" action="{% url 'login' %}" class="space-y-6">
                    {% csrf_token %}

                    <!-- Hiển thị lỗi nếu sai username/password -->
                    {% if form.errors %}
                    <div class="p-3 rounded-lg bg-red-900/30 border border-red-500/50 text-red-300 text-sm flex items-center gap-2">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>Invalid credentials. Please try again.</span>
                    </div>
                    {% endif %}

                    <!-- Tham số Next để quay lại trang bị chặn trước đó -->
                    <input type="hidden" name="next" value="{{ next|default:'/' }}">

                    <!-- Username field -->
                    <div class="space-y-2">
                        <label for="username" class="block text-sm font-medium">Username</label>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="your username"
                            required
                            class="form-input w-full px-4 py-3 rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-emerald-500/20"
                        />
                    </div>

                    <!-- Password field -->
                    <div class="space-y-2">
                        <label for="password" class="block text-sm font-medium">Password</label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="••••••••••••••••"
                            required
                            class="form-input w-full px-4 py-3 rounded-lg text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-emerald-500/20"
                        />
                    </div>

                    <!-- Remember me & Forgot password -->
                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="remember_me" class="w-4 h-4 rounded" style="accent-color: #10b981;">
                            <span class="text-slate-400">Remember me</span>
                        </label>
                        <a href="#" class="text-emerald-500/80 hover:text-emerald-400">Forgot password?</a>
                    </div>

                    <!-- Submit button -->
                    <button
                        type="submit"
                        class="submit-btn w-full py-3 px-4 rounded-lg font-semibold text-white text-center transition-all duration-300 mt-8"
                    >
                        Secure Login
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-700/30"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-slate-800/80 text-slate-500">or</span>
                    </div>
                </div>

                <!-- SSO button (placeholder) -->
                <button
                    type="button"
                    class="w-full py-3 px-4 rounded-lg border border-slate-700/50 text-slate-300 font-medium hover:bg-slate-700/30 transition-all duration-300 flex items-center justify-center space-x-2"
                >
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                        <path d="M12 4v8l6.85 4.07"/>
                    </svg>
                    <span>Sign in with Institutional SSO</span>
                </button>
            </div>

            <!-- Footer info -->
            <div class="text-center text-xs text-slate-500 space-y-2">
                <p>Secure HIPAA-compliant authentication</p>
                <p class="space-x-4">
                    <a href="#" class="hover:text-slate-400">Security</a>
                    <span>•</span>
                    <a href="#" class="hover:text-slate-400">Privacy</a>
                    <span>•</span>
                    <a href="#" class="hover:text-slate-400">Terms</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
