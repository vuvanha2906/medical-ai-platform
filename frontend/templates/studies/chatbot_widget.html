{% csrf_token %}
<button id="chat-toggle" class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-r from-emerald-600 to-emerald-500 rounded-full shadow-[0_0_20px_rgba(16,185,129,0.3)] flex items-center justify-center text-white hover:scale-110 transition-all duration-300 z-[9999]">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
</button>

<div id="chat-window" class="fixed bottom-24 right-6 w-[380px] h-[550px] bg-navy-900/95 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl hidden flex-col z-[9999] overflow-hidden transform transition-all">

    <div class="p-4 border-b border-white/10 bg-navy-950/50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="relative">
                <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center border border-emerald-500/30">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 border-2 border-navy-900 rounded-full"></span>
            </div>
            <div>
                <h3 class="text-sm font-bold text-white">MedVision AI</h3>
                <p class="text-[10px] text-emerald-400 font-mono">Clinical Assistant</p>
            </div>
        </div>
        <button onclick="document.getElementById('chat-window').classList.add('hidden')" class="text-gray-400 hover:text-white transition-colors p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm bg-gradient-to-b from-transparent to-navy-950/30 scroll-smooth">
        <div class="flex gap-3 max-w-[90%]">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 flex-shrink-0 flex items-center justify-center border border-emerald-500/30 mt-1">
                <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <div class="bg-navy-800 border border-white/5 p-3 rounded-2xl rounded-tl-sm text-gray-300 leading-relaxed shadow-sm break-words whitespace-pre-wrap">Xin chào Bác sĩ! Tôi có thể hỗ trợ tra cứu phác đồ điều trị và giải thích kết quả AI. Bác sĩ cần tôi giúp gì hôm nay?</div>
        </div>
    </div>

    <div id="typing-indicator" class="hidden px-4 pb-2">
        <div class="flex gap-3 max-w-[85%]">
            <div class="w-6 h-6 rounded-full bg-emerald-500/20 flex-shrink-0 flex items-center justify-center border border-emerald-500/30 mt-1">
                <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <div class="bg-navy-800 border border-white/5 px-4 py-3 rounded-2xl rounded-tl-sm flex items-center gap-1.5 w-fit">
                <div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce"></div>
                <div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
        </div>
    </div>

    <div class="p-3 bg-navy-950/80 border-t border-white/10 backdrop-blur-md">
        <div class="relative flex items-center">
            <input id="chat-input" type="text" placeholder="Hỏi AI về y khoa..." class="w-full bg-navy-900 border border-white/10 py-3 pl-4 pr-12 rounded-xl text-gray-200 text-sm outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-all placeholder-gray-500 shadow-inner">
            <button id="send-btn" class="absolute right-2 p-1.5 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const chatToggle = document.getElementById('chat-toggle');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const msgContainer = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');

    // Toggle Chat
    chatToggle.onclick = () => {
        chatWindow.classList.toggle('hidden');
        chatWindow.classList.toggle('flex');
        if (!chatWindow.classList.contains('hidden')) chatInput.focus();
    };

    // Gửi tin nhắn
    async function sendMessage() {
        const question = chatInput.value.trim();
        if (!question) return;

        // 1. In câu hỏi của người dùng (Thêm chống tràn chữ)
        msgContainer.innerHTML += `
            <div class="flex justify-end mb-4">
                <div class="bg-emerald-600 text-white p-3 rounded-2xl rounded-tr-sm text-sm max-w-[85%] shadow-md leading-relaxed break-words whitespace-pre-wrap">${question}</div>
            </div>`;

        chatInput.value = '';
        msgContainer.scrollTop = msgContainer.scrollHeight;

        // 2. Hiện Typing...
        typingIndicator.classList.remove('hidden');
        msgContainer.scrollTop = msgContainer.scrollHeight;

        // Lấy Modality tự động
        const modality = typeof CURRENT_MODALITY !== 'undefined' ? CURRENT_MODALITY.toLowerCase() : 'xray';

        try {
            // Lấy CSRF Token an toàn
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            const csrfToken = csrfInput ? csrfInput.value : '';

            if (!csrfToken) {
                console.warn("⚠️ Không tìm thấy CSRF Token!");
            }

            const resp = await fetch("/api/chat/", {
                method: 'POST',
                body: JSON.stringify({ question: question, modality: modality }),
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                }
            });

            const data = await resp.json();

            // 4. Ẩn Typing và in câu trả lời của AI
            typingIndicator.classList.add('hidden');

            const formattedAnswer = data.answer ? data.answer.replace(/\n/g, '<br>') : "Không có phản hồi từ AI.";

            // In đáp án (Thêm chống tràn chữ)
            msgContainer.innerHTML += `
                <div class="flex gap-3 max-w-[90%] mb-4">
                    <div class="w-6 h-6 rounded-full bg-emerald-500/20 flex-shrink-0 flex items-center justify-center border border-emerald-500/30 mt-1">
                        <svg class="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <div class="bg-navy-800 border border-white/5 p-3 rounded-2xl rounded-tl-sm text-gray-300 leading-relaxed shadow-sm break-words whitespace-pre-wrap">${formattedAnswer}</div>
                </div>`;

            msgContainer.scrollTop = msgContainer.scrollHeight;

        } catch (error) {
            typingIndicator.classList.add('hidden');
            msgContainer.innerHTML += `
                <div class="flex justify-start mb-4 max-w-[85%]">
                    <div class="bg-red-500/20 border border-red-500/30 text-red-300 p-3 rounded-2xl rounded-tl-sm text-sm break-words whitespace-pre-wrap">
                        ❌ Lỗi kết nối máy chủ AI. Vui lòng thử lại.
                    </div>
                </div>`;
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }
    }

    // Gắn sự kiện Enter và nút Send
    chatInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
            e.preventDefault(); // Ngăn hành vi mặc định của phím Enter (để chống bug submit form nếu có)
            sendMessage();
        }
    };
    sendBtn.onclick = sendMessage;
</script>
