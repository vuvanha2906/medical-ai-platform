<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Medical AI Platform</title>
    <!-- Add your CSS and other head elements here -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Basic fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out forwards;
        }

        /* Custom scrollbar for WebKit browsers */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5); /* slate-400 with transparency */
            border-radius: 4px;
            border: 2px solid transparent;
            background-clip: content-box;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: rgba(100, 116, 139, 0.8); /* slate-700 with transparency */
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100 min-h-screen flex">

    <nav>
        <ul>
            <li><a href="{% url 'studies:dashboard' %}">Dashboard</a></li>
            <li><a href="{% url 'studies:study_list' %}">Studies</a></li>
            <li><a href="{% url 'studies:analytics' %}">Analytics</a></li>
        </ul>
    </nav>

    <div class="content flex-1 flex flex-col ml-64">
            {% block content %}{% endblock %}
    </div>

    <!-- Add your scripts and other body elements here -->
</body>
</html>
